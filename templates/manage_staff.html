{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <h2 style="margin-right: 200px;">Manage Staff</h2>
    <a href="{% url 'add_staff' %}">add staff</a>
    <table border="2px">
        <tr>
            <th>username</th>
            <th>action</th>
        </tr>
        {% for i in staff_list %}
        <tr>
            <td style="color: blue;">{{i.username}}</td>
            <td>
                <a href="{% url 'edit_staff' i.id %}">Edit</a>
                <a href="{% url 'delete_staff' i.id %}" onclick="return confirm('Are You Sure ? ')" >Delete</a>
            </td>
        </tr>
        {% endfor %}
    </table>
    <tr>
        <td>No staff Found</td>
    </tr>
    <br><br>
    <a href="{% url 'admin_dashboard' %}">Back to dashboard</a>
</body>
</html>
